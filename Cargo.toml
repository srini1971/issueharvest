[package]
name = "issueharvest"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Discover and rank relevant open-source issues using the GitHub API."
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/srini1971/issueharvest"
keywords = ["github", "issues", "open-source", "discovery"]
categories = ["api-bindings", "development-tools"]

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
tokio = { version = "1", features = ["rt", "macros", "sync"] }
